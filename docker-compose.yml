services:
  webgoat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBGOAT_VERSION: ${WEBGOAT_VERSION:-2026.4-SNAPSHOT}
    image: ie3142-webgoat:${IMAGE_TAG:-local}
    environment:
      TZ: ${TZ:-Asia/Colombo}
      # Bind both Spring Boot applications on every container interface. Host
      # exposure remains restricted to loopback by the ports below.
      WEBGOAT_HOST: ${WEBGOAT_HOST:-0.0.0.0}
      WEBWOLF_HOST: ${WEBWOLF_HOST:-0.0.0.0}
    ports:
      - "127.0.0.1:${WEBGOAT_PORT:-8080}:8080"
      - "127.0.0.1:${WEBWOLF_PORT:-9090}:9090"
    volumes:
      - webgoat-data:/home/webgoat/.webgoat-${WEBGOAT_VERSION:-2026.4-SNAPSHOT}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/WebGoat/actuator/health || curl -fsS http://127.0.0.1:8080/WebGoat/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: "no"

volumes:
  webgoat-data:
